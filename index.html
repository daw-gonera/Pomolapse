<!doctype html>
<html lang="en">

<head> <!-- head nichts was der user sehen kann aber der browser braucht -->
  <meta charset="UTF-8" /> <!-- meta wie man die seite rändert zb UTF-8 für ä ü usw  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomolapse</title> <!-- das was im tab angezeigt wird -->
</head>

<body>

  <header> <!-- Titel und Einleitung -->
    <h1>
      Pomolapse
    </h1>
    <p>
      Focus while art comes to life.
    </p>
  </header>

  <main> <!-- main ist der hauptteil der seite -->

    <section class="how-it-works">
      <!-- Erklärung: unfärtiges Bild-->
       <h2>How it Works</h2>

       <div class="comparison-images">
       <img src="./src/ChatGPT-Bild 30. Sept. 2026, 11_04_47.png" alt="Example Image: unfinished" /> <!-- these are two AI generated images just for demonstration and learning purposes -->
       <img src="./src/ChatGPT-Bild 30. Sept. 2026, 11_05_16.png" alt="Example Image: finished" />  <!-- at a later time i will replace these with actual images -->
       </div>

       <p>Your focus session brings the artwork to life.</p>
    </section>

    <section class="choose-timelapse"> <!-- Ein schon vorhandener Timelapse auswählen -->
      <img src="example.png" alt="Beispiel Timelapse 1" />
      <img src="example.png" alt="Beispiel Timelapse 2" />
      <img src="example.png" alt="Beispiel Timelapse 3" />

      <h2>Choose your Timelapse</h2>
    </section>

    <section><!-- Einen eigenen Timelapse hochladen -->
      <h2>Or upload your own Timelapse</h2>
      <input type="file" id="timelapseInput" accept="video/*" />
    </section>

    <section id="focusSection"><!-- Nach dem hochladen oder schon bei der auswahl der beispiel Timelapse soll die seite sich anpassen und das video angezeigt werden -->
      <h2>Focus Sessions</h2>
      <p>Watch your artwork come to life:</p>
      <video controls src="/example.mp4"></video>
      <p class="timer" id="timer"> 25:00 </p> <!-- class für css und id für javascript --> <!-- beispiel Timer -->
      <button type="button" id="startButton">Start Focus Session</button>
    </section>
    
  </main>


  <script type="module" src="/src/main.js"></script>
</body>

</html>
